name: Publication literature audit

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply-audit:
    if: contains(github.event.head_commit.message, '[publication-audit]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply source-bounded publication wording
        run: python scripts/apply_publication_literature_audit.py

      - name: Verify publication boundary
        run: |
          python paper/check_submission_bundle.py
          python scripts/check_repository_boundaries.py
          grep -q 'Inoue (1990a)' paper/mee_manuscript_draft.md
          grep -q 'Inoue (1990b)' paper/mee_manuscript_draft.md
          grep -q 'Figure S1 — Known-truth recovery' paper/mee_manuscript_draft.md
          ! grep -q 'Figure 4 — NOV information and calibration' paper/mee_manuscript_draft.md
          ! grep -q 'Figure 5 — Earned ecological projection' paper/mee_manuscript_draft.md
          ! grep -q 'pollinator turnover along island isolation gradients' paper/mee_manuscript_draft.md
          git diff --check

      - name: Commit audited publication prose
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/mee_manuscript_draft.md docs/inoue_literature_values.md docs/campanula_channel_protocol.md
          git diff --cached --quiet && { echo 'no publication changes'; exit 1; }
          git commit -m '[publication-audit-applied] align Campanula claims with primary sources'
          git push origin HEAD:main
