name: CI

on:
  # Feature branches are validated by pull_request. Running both push and
  # pull_request on the same branch duplicates the complete 3-version matrix.
  push:
    branches: ["main"]
  pull_request:

# A PR only needs validation for its newest head. This prevents rapid scientific
# review commits from leaving obsolete Python 3.10-3.12 matrices queued behind
# the current code under review.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check submission bundle
        run: python paper/check_submission_bundle.py

      - name: Check MEE Research Article format
        run: python paper/check_mee_submission.py

      - name: Check repository program boundaries
        run: python scripts/check_repository_boundaries.py

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test figure and G2 v2 benchmark CLIs
        run: |
          mkdir -p outputs/ci
          python -m causal_model.confound_demo  --n-attempts 200 --figure outputs/ci/confound.png
          python -m causal_model.synthetic_demo --n-attempts 800 --figure outputs/ci/synthetic.png
          python -m causal_model.nov_calibration --n-attempts 400 --figure outputs/ci/nov.png
          python -m causal_model.known_truth_benchmark \
            --n-attempts 100 --noise-rates 0.0,0.1 \
            --figure outputs/ci/known_truth.png
          python -m causal_model.generality_sweep \
            --n-systems 20 --n-attempts 300 --n-distractors 2 \
            --budget-sweep 0,1,2 \
            --policies rach_seq,random_order \
            --budget-table outputs/ci/rach_seq_budget.csv

      - name: Check outputs were written
        run: |
          for f in confound synthetic nov known_truth; do
            test -s "outputs/ci/$f.png" || { echo "missing outputs/ci/$f.png"; exit 1; }
          done
          test -s outputs/ci/rach_seq_budget.csv || { echo "missing G2 v2 policy table"; exit 1; }
          grep -q '^rach_seq,' outputs/ci/rach_seq_budget.csv || { echo "missing rach_seq rows"; exit 1; }
          grep -q '^random_order,' outputs/ci/rach_seq_budget.csv || { echo "missing random_order rows"; exit 1; }
          echo "all smoke-test figures and G2 v2 policy rows generated"
