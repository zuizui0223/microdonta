name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check scientific submission boundary
        run: python paper/check_submission_bundle.py

      - name: Check MEE Research Article format
        run: python paper/check_mee_submission.py

      - name: Check active method naming
        run: python paper/check_active_naming.py

      - name: Check repository program boundaries
        run: python scripts/check_repository_boundaries.py

      - name: Run test suite
        run: pytest -q

      - name: Build publication figures and anonymous reviewer bundle
        if: matrix.python-version == '3.11'
        run: |
          mkdir -p outputs/g5/figures
          python -m causal_model.confound_demo --figure outputs/g5/figures/figure1_confound.png
          python paper/make_g2_figure.py --output outputs/g5/figures/figure2_g2_frozen_v2.png
          python -m causal_model.observation_value_calibration --figure outputs/g5/figures/figure3_information_value_calibration.png
          python -m causal_model.known_truth_benchmark --figure outputs/g5/figures/figureS1_known_truth.png
          python paper/build_reviewer_bundle.py
          cd outputs/mee/reviewer_bundle
          PYTHONPATH=. python -m pytest --rootdir=. -q tests
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('bundle_manifest.json').read_text())
          assert manifest['method_name'] == 'Mechanism-Resolving Observation Design'
          assert manifest['boundary_paper_included'] is False
          assert manifest['public_repository_metadata_included'] is False
          assert manifest['historical_frozen_labels_preserved'] is True
          files = set(manifest['files'])
          assert 'figures/figure3_information_value_calibration.png' in files
          assert 'review_manuscript.md' in files
          assert not any('boundary_manuscript' in path for path in files)
          print('methods reviewer bundle isolation OK')
          PY

      - name: Smoke-test controlled figure and frozen G2 CLIs
        run: |
          mkdir -p outputs/ci
          python -m causal_model.confound_demo --n-attempts 200 --figure outputs/ci/confound.png
          python -m causal_model.synthetic_demo --n-attempts 800 --figure outputs/ci/synthetic.png
          python -m causal_model.observation_value_calibration --n-attempts 400 --figure outputs/ci/information_value.png
          python -m causal_model.known_truth_benchmark \
            --n-attempts 100 --noise-rates 0.0,0.1 \
            --figure outputs/ci/known_truth.png
          # Historical policy key retained by the frozen benchmark CLI.
          python -m causal_model.generality_sweep \
            --n-systems 20 --n-attempts 300 --n-distractors 2 \
            --budget-sweep 0,1,2 \
            --policies rach_seq,random_order \
            --budget-table outputs/ci/information_guided_budget.csv

      - name: Check outputs were written
        run: |
          for f in confound synthetic information_value known_truth; do
            test -s "outputs/ci/$f.png" || { echo "missing outputs/ci/$f.png"; exit 1; }
          done
          test -s outputs/ci/information_guided_budget.csv || { echo "missing frozen G2 policy table"; exit 1; }
          grep -q '^rach_seq,' outputs/ci/information_guided_budget.csv || { echo "missing historical guided-policy rows"; exit 1; }
          grep -q '^random_order,' outputs/ci/information_guided_budget.csv || { echo "missing random-order rows"; exit 1; }
          echo "all controlled outputs generated"
