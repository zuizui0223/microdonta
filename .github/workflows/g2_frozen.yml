name: Frozen G2 v2

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frozen-g2:
    if: contains(github.event.head_commit.message, '[g2-frozen-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify frozen submission boundary
        run: |
          python paper/check_submission_bundle.py
          python scripts/check_repository_boundaries.py
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Run frozen G2 v2 exactly once
        run: python paper/run_g2_frozen_benchmark.py --output-dir outputs/g2_frozen

      - name: Verify provenance snapshot
        run: |
          test -s outputs/g2_frozen/g2_system_records.csv
          test -s outputs/g2_frozen/g2_budget_by_seed_policy.csv
          test -s outputs/g2_frozen/g2_budget_policy_aggregate.csv
          test -s outputs/g2_frozen/g2_policy_contrast_by_seed.csv
          test -s outputs/g2_frozen/g2_policy_contrast_aggregate.csv
          test -s outputs/g2_frozen/g2_protocol_snapshot.json
          python - <<'PY'
          import json, os
          p = json.load(open('outputs/g2_frozen/g2_protocol_snapshot.json'))
          assert p['protocol']['protocol_id'] == 'rach-g2-truth-peek-free-v2'
          assert p['code_commit_sha'] == os.environ['GITHUB_SHA']
          assert len(p['protocol_sha256']) == 64
          print('provenance OK', p['code_commit_sha'], p['protocol_sha256'])
          PY

      - name: Upload frozen G2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2-frozen-v2-${{ github.sha }}
          path: outputs/g2_frozen/
          if-no-files-found: error
          retention-days: 90
