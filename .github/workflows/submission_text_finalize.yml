name: Finalize submission text

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-submission-text]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Integrate frozen results into text
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('finalize_submission_text', 'scripts/finalize_submission_text.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          # Mainline already carries the final NOV-selection semantics. Checker
          # markers are patched explicitly below.
          mod.update_mainline = lambda: None
          mod.update_checker = lambda: None
          mod.main()
          PY

      - name: Update final submission checker markers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('paper/check_submission_bundle.py')
          text = path.read_text(encoding='utf-8')
          old = '        "Numerical benchmark statements remain subject",'
          new = '\n'.join([
              '        "Frozen G2 v2 results below come only",',
              '        "maximum current validated NOV",',
              '        "0.990 ± 0.0079",',
              '        "paper/results/g2_frozen_v2_summary.json",',
          ])
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old_forbidden = '        "98.5% of systems fully converging",'
          new_forbidden = '\n'.join([
              '        "98.5% of systems fully converging",',
              '        "maximum expected confounding-edge cuts",',
              '        "rank candidates by expected confounding-edge cuts",',
          ])
          assert text.count(old_forbidden) == 1
          text = text.replace(old_forbidden, new_forbidden, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify text and governance
        run: |
          ! grep -q 'maximum expected confounding-edge cuts' paper/mee_manuscript_draft.md
          ! grep -q 'rank candidates by expected confounding-edge cuts' docs/rach_theory.md
          grep -q '0.990 ± 0.0079' paper/mee_manuscript_draft.md
          grep -q 'maximum current validated NOV' paper/mee_manuscript_draft.md
          python paper/check_submission_bundle.py
          python scripts/check_repository_boundaries.py
          git diff --check

      - name: Build frozen Figure 3
        run: |
          python -m pip install matplotlib
          python paper/make_g2_figure.py --output outputs/mee/figure3_g2_frozen_v2.png
          test -s outputs/mee/figure3_g2_frozen_v2.png

      - name: Upload Figure 3 preview
        uses: actions/upload-artifact@v4
        with:
          name: figure3-g2-frozen-v2-${{ github.sha }}
          path: outputs/mee/figure3_g2_frozen_v2.png
          if-no-files-found: error
          retention-days: 90

      - name: Commit integrated submission text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/mee_manuscript_draft.md docs/rach_theory.md paper/README.md paper/check_submission_bundle.py
          git diff --cached --quiet && { echo 'no text changes'; exit 1; }
          git commit -m '[submission-text-finalized] integrate frozen G2 and validation results'
          git push origin HEAD:main
