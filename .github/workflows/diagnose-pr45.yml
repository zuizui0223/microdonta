name: Diagnose PR 45 tests

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    if: github.event.pull_request.number == 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run tests with full failure report
        id: tests
        shell: bash
        run: |
          set +e
          pytest -q --tb=short --maxfail=10 > pytest-report.txt 2>&1
          status=$?
          cat pytest-report.txt
          exit $status
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr45-pytest-report
          path: pytest-report.txt
