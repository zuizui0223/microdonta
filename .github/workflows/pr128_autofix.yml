name: PR128 one-shot typo fix

on:
  push:
    branches:
      - fix-information-limit-stop-claim-20260906

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[pr128-autofix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-information-limit-stop-claim-20260906
      - name: Fix manuscript edit accident
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('paper/manuscript.md')
          text = p.read_text(encoding='utf-8')
          old = 'distinguishishable'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, 'distinguishable')
          p.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          Path('.github/workflows/pr128_autofix.yml').unlink()
          PY
      - name: Commit one-shot fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix manuscript typo and newline [pr128-autofix]"
          git push origin HEAD:fix-information-limit-stop-claim-20260906
