[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanism-resolution-design"
version = "0.1.0"
description = "Mechanism-Resolving Observation Design: information-theoretic selection of observations that reduce residual mechanistic ambiguity."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ruiqi Zhang" },
]
keywords = [
    "mechanism inference",
    "mechanistic ambiguity",
    "mutual information",
    "value of information",
    "sequential design",
    "observation design",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
    "streamlit>=1.40",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
    "streamlit>=1.40",
]

[project.urls]
Repository = "https://github.com/zuizui0223/microdonta"
BoundaryPerspective = "https://github.com/zuizui0223/boundary"

[tool.setuptools]
packages = ["causal_model", "attraction_trait_model"]

[tool.pytest.ini_options]
testpaths = ["tests", "causal_model", "examples"]
addopts = "-q"
