scenarios:
  - name: H1_pollinator_loss_only
    enabled_processes: [pollinator_loss]
    parameter_overrides:
      selfing_ability: 0.0
      inbreeding_load: 0.0
  - name: H2_pollinator_loss_reproductive_assurance
    enabled_processes: [pollinator_loss, selfing]
    parameter_overrides:
      selfing_ability: 0.55
  - name: H3_pollinator_loss_inbreeding
    enabled_processes: [pollinator_loss, selfing, inbreeding_depression]
    parameter_overrides:
      selfing_ability: 0.55
      inbreeding_load: 0.25
  - name: H4_pollinator_loss_drift
    enabled_processes: [pollinator_loss, drift]
    parameter_overrides:
      genetic_drift_strength: 0.07
      migration_rate: 0.01
  - name: H5_compound_capom
    enabled_processes: [pollinator_loss, selfing, inbreeding_depression, drift, selfing_syndrome]
    parameter_overrides:
      selfing_ability: 0.62
      inbreeding_load: 0.22
      genetic_drift_strength: 0.06
      other_pollinator_efficiency: 0.30
